name: 台股 SOP 訊號通知

on:
  schedule:
    # 台灣時間每天早上 06:00（開盤前，看前一交易日收盤後的結論）
    # = UTC 前一天 22:00，所以UTC的星期要對應「週日～週四晚上」
    # 才會落在台灣的「週一～週五早上」。週末沒交易日也照跑，資料不會變
    # 不會誤發變化通知。
    #
    # 2026-09-15：GitHub 的 schedule 沒有SLA保證，實測發生過排定時間
    # 過了超過一小時完全沒觸發（不是失敗，是根本沒建立run）。因此在
    # 原本06:00之外，多排06:30、07:00兩個備援時間點，只要三次裡有一次
    # 準時觸發就不會整天沒收到通知。notify_email.py 的 main() 會先檢查
    # 今天是否已經跑過（看 signal_log.csv 最後一行日期），跑過就直接
    # 跳過，所以就算三次都準時觸發，也只會真的判讀+寄信一次。
    - cron: "0 22 * * 0-4"
    - cron: "30 22 * * 0-4"
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}   # 允許在 GitHub Actions 頁面手動觸發，方便測試

permissions:
  contents: write   # 要把最新的訊號狀態 commit 回 repo

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 執行 SOP 判讀並視情況寄信通知
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python notify_email.py

      - name: 把最新的訊號狀態、每日紀錄與上櫃法人快照 commit 回 repo
        run: |
          git config user.name "sop-notify-bot"
          git config user.email "actions@github.com"
          # mkdir -p 先確保資料夾存在，避免上櫃法人快照抓取失敗時
          # （資料夾還沒被建立）git add 對不存在的路徑報錯、擋掉整個commit
          mkdir -p data/tpex_3insti_daily
          git add data/last_signals.json data/signal_log.csv data/tpex_3insti_daily/
          git diff --cached --quiet || git commit -m "更新 SOP 訊號狀態、每日紀錄與上櫃法人快照（自動）"
          git push
