name: 本週法人排行自動輪替

on:
  schedule:
    # 台灣時間每週一早上 05:30，比每天06:00的訊號通知(notify.yml)早半小時，
    # 確保週一早上寄出的通知信已經是換過的新一週排行。
    # = UTC 週日 21:30。
    - cron: "30 21 * * 0"
  workflow_dispatch: {}   # 允許在 GitHub Actions 頁面手動觸發，方便測試

permissions:
  contents: write   # 要把新算出的排行 commit 回 repo

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 計算上週三大法人買賣超前十大（買超+賣超），覆寫本週輪替名單
        run: python institutional_ranking.py rotate

      - name: 把新的本週法人排行 commit 回 repo
        run: |
          git config user.name "sop-notify-bot"
          git config user.email "actions@github.com"
          git add data/weekly_institutional_picks.json
          git diff --cached --quiet || git commit -m "更新本週法人買賣超排行（自動）"
          git push
