# 費率設定。手續費折數/最低收取無統一法律數字，請依你實際使用的券商調整。
# 稅率三項依《證券交易稅條例》，2026-11-13查核，之後法規若修訂需回來更新：
#   - 一般股票0.3%，股票型ETF 0.1%（全國法規資料庫 law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340078）
#   - 現股當沖減半0.15%：只適用一般股票，ETF當沖不適用減半（ETF固定0.1%）
#     （learningpa.cc/blog13/：「在賣出ETF時，交易稅只要0.1%，但是就沒有
#     當沖交易稅減半的優惠」）
#   - 減半優惠落日日期：2027-12-31，屆期後若未展延，day_trade_rate應改回
#     等同stock_rate
brokerage_fee:
  legal_rate: 0.001425      # 法定上限0.1425%，買賣各收一次
  discount: 1.0             # 你的券商折數，例如6折填0.6——預設1.0(不打折)，請自行調整
  min_fee: 0                # 最低手續費（元），各券商不同，預設0代表無最低收取下限

securities_tax:
  stock_rate: 0.003          # 一般股票0.3%，賣出時收
  etf_rate: 0.001            # 股票型ETF 0.1%，賣出時收，當沖也不減半
  day_trade_rate: 0.0015     # 一般股票現股當沖減半0.15%，不適用於ETF
  day_trade_discount_expires: "2027-12-31"  # 減半優惠落日日期
