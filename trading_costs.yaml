# 費率設定。稅率三項依《證券交易稅條例》，2026-11-13查核，之後法規若修訂
# 需回來更新：
#   - 一般股票0.3%，股票型ETF 0.1%（全國法規資料庫 law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340078）
#   - 現股當沖減半0.15%：只適用一般股票，ETF當沖不適用減半（ETF固定0.1%）
#     （learningpa.cc/blog13/：「在賣出ETF時，交易稅只要0.1%，但是就沒有
#     當沖交易稅減半的優惠」）
#   - 減半優惠落日日期：2027-12-31，屆期後若未展延，day_trade_rate應改回
#     等同stock_rate
#
# 手續費折數/最低收取依你實際使用的券商（元大證券，2026-11-14查核，電子
# 下單）：
#   - 折數6折：元大官網未直接公告具體折數數字，此為多個第三方比價網站
#     （rich01.com、money101.com）交叉確認一致的電子下單折數，建議你用
#     實際對帳單核對一次。
#   - 最低手續費依是否為零股分兩檔（元大官網「電子平台交易事項」頁）：
#     一般（整股）交易不足20元以20元計收；盤中(後)零股/興櫃零股/定期
#     定額交易不足1元以1元計收。
#   - 捨去方式：元大官網〔3101股票庫存欄位說明〕原文「手續費率...交易
#     稅率...皆無條件捨去至整數位」——是無條件捨去（truncate），不是
#     四捨五入，calc_fee()/calc_sell_tax()已經改用math.floor()對應。
brokerage_fee:
  legal_rate: 0.001425      # 法定上限0.1425%，買賣各收一次
  discount: 0.6             # 元大電子下單6折，請自行核對實際對帳單
  min_fee_round_lot: 20     # 整股（股數是1000的倍數）最低手續費
  min_fee_odd_lot: 1        # 零股（股數不是1000的倍數）最低手續費

securities_tax:
  stock_rate: 0.003          # 一般股票0.3%，賣出時收
  etf_rate: 0.001            # 股票型ETF 0.1%，賣出時收，當沖也不減半
  day_trade_rate: 0.0015     # 一般股票現股當沖減半0.15%，不適用於ETF
  day_trade_discount_expires: "2027-12-31"  # 減半優惠落日日期
