# updated 2026-10-13：記錄KD365買進側Phase2回測結果(test_kd365_w_bottom_
#   buy.py，21檔/24個月)，為「沒雙重確認就降級觀望」(Phase3)提供依據。
#   比較W底突破時「均線+MACD兩者同步、KD365不同步」(A組) vs「均線+MACD+
#   KD365三者同步」(B組)：
#   - A組97筆事件，5日後平均+7.27%/漲86.7%(60筆)
#   - B組1253筆事件，5日後平均+4.89%/漲70.7%(737筆)
#   樣本數最多、最可信的5日天期，A組（KD365不同步那組）報酬跟上漲比例
#   都比B組（三者都確認）更高——跟課程「雙重驗證能過濾亂買、篩出真正
#   翻身」的方向相反。另外事件數量差13倍(97 vs 1253)，顯示均線+MACD
#   同步時KD365有93%機率也已經同步，這個條件在目前的操作化方式下很少
#   真的篩掉什麼。20日天期排除比例過高(B組1253筆排除1185筆只剩68筆)，
#   不夠可信。
#   結論：這次證據**不支持**讓KD365確認否決conclusion(原訂Phase3計畫)，
#   Phase3暫緩，待重新討論操作化方式或補更多樣本再評估。
# updated 2026-10-12：記錄KD(36,5,5) Double Check回測結果(test_kd365_
#   double_check.py，21檔/24個月)，為後續要不要讓它否決conclusion提供
#   依據。過程踩過兩次方法論坑，記下來避免以後重踩：
#   1) 第一版誤把「MACD頂背離」當成Double Check的MACD那一半，實際上課程
#      講的是MACD自己死叉(DIF穿破訊號線，不管在不在零軸之上)，背離是
#      另一個獨立條件——測錯條件時B組(Double Check)完全沒有比單看MACD
#      更有保護力。
#   2) 改測MACD死叉+KD365死叉後，原始版本不管訊號中途有沒有反轉、一律
#      算到第20天，錯誤地把訊號早就失效之後的漲跌也算進Double Check的
#      功過(2026-03-23金居(8358)案例：死叉後約10個交易日KD365就金叉
#      翻多，但原版硬算20天後報酬+76.9%當失敗案例)——改成「訊號到第N天
#      都還沒反轉才算進那個天期」後，三組(A:只有MACD死叉/B:Double Check/
#      C:B+生死線轉下彎)在訊號維持期間都呈現清楚下跌傾向(20日下跌比例
#      85~93%)，但A/B/C彼此差異不明顯、C在10/20日樣本數太小(19筆/7筆)，
#      「KD365雙重確認是否真的比單看MACD更好」這個核心問題仍待更多樣本
#      驗證。另外這個篩選法本身跟股價走弱有內建相關性(KD/MACD狀態是從
#      股價算出來的)，下跌比例數字不宜直接當成客觀命中率解讀。
#   使用者決定：儘管證據仍待加強，先讓Double Check+生死線轉下彎(對應C組)
#   正式否決conclusion，列為下一輪待實作項目，見後續commit。
# updated 2026-10-11：新增 industry_groups（產業龍頭股族群對照表），供
#   notify_email.py在watchlist裡有股票觸發買進/加碼時，提示同族群其他
#   watchlist股票（純列名單提示，不影響買賣結論本身）
# updated 2026-10-07：volume_bear_confirm(MACD頂背離+OBV同步走壞)新增均線
#   同步閘門(volume_bear_confirm_requires_ma_sync)，均線仍偏多時從「全賣」
#   降級為「分級減碼」（conclusion不變，caveats註明建議只先減碼50%），依
#   test_volume_bear_confirm_ma_gate(_wide).py回測驗證（60檔/36個月/138筆
#   事件：均線偏多時單獨出現此訊號，20日後續跌45.3%/上漲54.7%，兩端皆有
#   肥尾，最差-47%最佳+75.4%）
# updated 2026-10-04：新增週KD金叉+週5/35MA(weekly_kd_golden_cross)、60分MA20+
#   MA120烏龜線+MA240三線確認(min60_turtle_confirm)兩條新規則，皆為歷史回測
#   驗證後新增，非但丁老師原始教材條文（見兩區塊內註解與對應test_*.py）
# updated 2026-09-28：新增 pattern_recognition 型態學輔助觸發層（W底/M頭/三角收斂），
#   純輔助觸發與Step6支撐壓力補充來源，不單獨產生買賣結論，見該區塊註解
# updated 2026-09-18：Step6左側平台改成偵測「多次觸碰的整理箱體」，不再只抄
#   離現在最近的單次孤立擺動點（原本的算法跟但丁老師目視判讀的平台常對不起來）
# updated 2026-09-16：新增CCI(順勢指標)第三代領先指標，比照MTM於60分/5分線
#   折返±100時強制觀望示警，不計入評分、不凌駕MTM/MACD/均線既有位階
# updated 2026-09-15：初版規則搬遷 + 新增訊號未同步與乖離過大強制觀望
#
# 但丁老師 SOP 判讀規則設定檔。
# 改規則只需要改這個檔案，不用動 sop_decision.py 裡的程式碼。
# 結構：
#   indicators   ：各步驟共用的門檻值/視窗長度（原本寫死在函式內的數字）
#   buy_rules    ：判定「買進」的條件
#   add_rules    ：判定「加碼」的條件
#   watch_rules  ：判定/強制降級為「觀望」的條件（含兩條新規則）
#   sell_rules   ：判定「賣出減碼」的條件
#   special_notes：不改變結論、只附加提示的特殊情境

version: "1.3"

# ==================================================================
# 共用指標參數
# ==================================================================
indicators:

  ma_slope:
    lookback: 3   # ma_slope() 比較幾根K棒前的均線值來判斷上揚/下彎/走平

  four_key_prices:
    applicable_timeframes: ["日"]   # 四關價只在日線適用

  ma_step:
    second_gate_ma: "MA10"     # 日線第二關快均線：站穩5MA之外，同時站上10MA視為止跌更明確
    second_gate_bonus: 1
    fast_up_bonus: 1           # 快均線上揚且站上 → 加分
    fast_down_penalty: -1      # 快均線下彎且跌破 → 扣分
    key_down_penalty: -2       # 生死線下彎 → 重扣分（任何買訊都要降級）
    key_up_bonus: 2            # 生死線上揚且站上 → 加分

  weekly_pullback_zone:
    min_bars: 4                # 至少要有4根K棒才判斷「止跌打底」
    recent_low_window: 4       # 檢查最近幾根K棒的低點是否不再創新低
    bonus: 1.0                 # 週線回檔落於週5MA~週20MA區間且止跌打底的加分

  weekly_kd_golden_cross:
    # 但丁老師原始教材沒有這條，是2026-10用24個月、13檔核心持股歷史回測
    # 驗證後新增：週KD金叉+站穩週5MA/週35MA(上揚)，10日後正報酬比例65.5%，
    # 優於無條件基準53.9%（見test_weekly_kd_and_daily_ma35_buy.py）。
    bonus: 1

  min60_turtle_confirm:
    # 但丁老師原始教材沒有這條，是2026-10用lookback 350天、13檔核心持股
    # 歷史回測驗證後新增：60分MA20+MA120(烏龜線)+MA240三線同步站上且上揚，
    # 5根K棒後正報酬比例53.1%，優於無條件基準50.3%（見
    # test_intraday_signals_buy.py）。
    bonus: 1

  macd:
    divergence_lookback: 20              # 頂背離偵測回看根數
    dif_above_zero_bonus: 1              # DIF在零軸之上
    dif_below_zero_penalty: -1           # DIF在零軸之下
    golden_cross_below_zero_bonus: 1     # 零軸下黃金交叉，僅弱勢反彈
    golden_cross_above_zero_bonus: 2     # 零軸上黃金交叉，動能轉強
    dead_cross_penalty: -2               # 死亡交叉

  kd365:
    # 但丁老師課程新增的第三代指標，跟MACD做Double Check。課程筆記原本
    # 寫「365」，經券商App參數截圖比對確認為「KD-隨機指標(常用)」預設：
    # 期間36／RSVt權值5／Kt權值5，不是單一個period=365的數字。
    # 只適用日/60分/5分，週線與月線維持原本的KD(9,3,3)（weekly_kd_
    # golden_cross規則），不套用這組參數。
    n: 36
    m1: 5
    m2: 5
    golden_cross_bonus: 1       # 待backtest驗證微調的初始值
    dead_cross_penalty: -1      # 待backtest驗證微調的初始值
    blunted_threshold_high: 80  # K值連續N根高於此視為高檔鈍化
    blunted_threshold_low: 20   # K值連續N根低於此視為低檔鈍化
    blunted_min_bars: 3         # 待backtest驗證微調的初始值
    divergence_lookback: 20     # 比照macd.divergence_lookback
    w_bottom_fresh_cross_window: 3
    # 2026-10-13：W底偵測用的KD365確認，從「目前狀態是不是多頭」改成
    # 「最近N個交易日內是不是剛黃金交叉」——backtest(test_kd365_w_bottom_
    # buy.py)比較過兩種操作化方式：「目前狀態」版完全沒證據支持（21檔/
    # 24個月，不同步那組報酬反而更高）；「剛交叉」版三個天期都明顯勝出
    # （5日/10日/20日平均報酬與上漲比例都更高）。3天比照left_side_
    # platform/cci既有confirm_bars=3的慣例，非另外驗證過的精確數字。

  volume:
    rising_bonus: 1     # OBV均線（或5分線用BBI）上揚
    falling_penalty: -1 # OBV均線（或5分線用BBI）下彎

  mtm:
    applicable_timeframes: ["60分"]
    lookback_bars: 3    # 檢查近幾根K棒是否死叉翻空
    # 2026-10-07新增：短期訊號反轉比例近期偏高（單週近7成異動幾天內又
    # 反轉回去），懷疑是MTM貼著零軸雜訊造成。confirm_bars=1（預設）＝
    # 舊行為不變；>1 時改成「連續N根都翻負」才觸發翻空示警，見
    # test_mtm_confirm_bars_whipsaw.py 的回測結果再決定要不要調大。
    confirm_bars: 1

  cci:
    # 第三代領先指標，與 MTM 並列參考，不強制優先順序（見 watch_rules.cci_exit_alert_downgrade）。
    # 二線輔助指標：不接進 score，只用來觸發跟MTM同等級的「觀望」示警，不凌駕MTM/MACD/均線。
    applicable_timeframes: ["60分", "5分"]
    signal_threshold: 100      # 突破後折返穿越 ±100 視為轉折訊號
    extreme_threshold: 200     # 突破 ±200 視為極端訊號，需特別關注（僅提示，不變更結論）
    lookback_bars: 3           # 檢查近幾根K棒是否曾站上+100或跌破-100後折返（比照MTM的lookback_bars）
    # 2026-10-08：CCI示警出現在30.9%的短期雜訊反轉事件中（僅次於Step6
    # 左側平台），懷疑是貼著±100來回折返被單根雜訊放大。用
    # test_short_term_whipsaw_fix_compare.py回測13檔60分K：confirm_bars=2
    # 沒有改善（183次雜訊反轉，比預設1還差），confirm_bars=3才真的有效
    # （132次，降26%），且4/8/16根K棒後的保護力(下跌比例)三者皆相近，
    # 沒有因此變差，故正式採用3；confirm_bars=1時維持舊行為，供需要時
    # 退回比較。
    confirm_bars: 3
    role: "secondary"          # 二線輔助指標，與 MTM 並列參考，不強制優先順序
    note: "預設參考值，非但丁老師原始教材明確數字，可依實戰經驗調整"

  left_side_platform:
    exclude_recent_bars: 5   # 排除最近幾根K棒，避免抓到自己
    pivot_window: 5          # 局部高低點判斷的前後窗口
    min_left_bars: 20        # 左側資料至少要有幾根才計算
    tolerance_pct: 0.02      # 「碰到/測到」視為在這個百分比以內；同時也用來判斷
                              # 兩個擺動點是不是「同一個平台價位」（見下方叢集判斷）
    support_bonus: 1         # 測到左側支撐未破 + 快均線轉向 → 加分
    resistance_penalty: -1   # 碰左側壓力 + 今開未過昨高 → 扣分
    # 2026-10-08：Step6出現在49.7%的短期雜訊反轉事件中，是目前最大宗
    # 來源——股價貼著支撐整理時，單根K棒微小波動就讓dist在容忍帶邊緣
    # 反覆跨進跨出。用test_short_term_whipsaw_fix_compare.py回測13檔
    # 60分K：confirm_bars=2沒有改善，confirm_bars=3才真的有效（雜訊
    # 反轉總數179→132，降26%），且降級訊號後續的保護力沒有因此變差，
    # 故正式採用3；confirm_bars=1時維持舊行為，供需要時退回比較。
    confirm_bars: 3
    platform_lookback_bars:  # 平台偵測只看「最近一段」歷史，避免抓到很久以前、
                              # 跟目前價格結構毫無關聯的孤立擺動點（真正的整理平台
                              # 是「最近這一段時間反覆測試」，不是「史上離現價最近」）
      週: 26      # 約半年
      日: 60      # 約3個月
      60分: 80    # 約2週交易時段
      5分: 240    # 約4個交易日
    platform_min_touches: 2  # 同一價位帶至少要被觸碰幾次，才算「整理平台」而不是
                              # 單次孤立擺動——預設值非但丁老師教材明確數字，可依
                              # 實戰經驗調整

  ma120_second_leg:
    applicable_timeframes: ["日"]   # 半年線只有日線有明確定義
    min_bars: 40
    window_bars: 60
    near_support_tolerance: 1.03    # 低點貼近/跌破MA120 3%以內視為測到支撐
    leg_split_rebound: 1.05         # 中間反彈拉開5%以上才算新的一腳
    undercut_tolerance: 0.98        # 第二腳低點跌破第一腳超過2%才算真正跌破
    recent_bars: 3                  # 第二腳須發生在最近幾根K棒內才算數

  deviation_threshold:   # 乖離率門檻：股價偏離關鍵均線超過此比例，不論多空方向一律嚴禁追高摸底
    週: 0.25
    日: 0.20
    60分: 0.10
    5分: 0.06

  scoring:
    four_key_weight: 2
    ma_weight: 2
    confidence_mid_abs_score: 4   # |score| >= 此值 → 信心中
    confidence_low_abs_score: 2   # |score| < 此值 → 信心低（介於兩者之間為中）

# ==================================================================
# 買進 buy_rules
# ==================================================================
buy_rules:
  score_threshold: 3   # 綜合分數 >= 門檻 → 買進

# ==================================================================
# 加碼 add_rules
# ==================================================================
add_rules:
  ma_bias_min: 3          # 均線偏多分數門檻
  macd_bias_min: 1        # MACD偏多分數門檻
  four_key_bias_min: 0    # 四關價不可偏空
  volume_bias_min: 0      # 量能不可偏空
  addon_ma_bias: 4        # 均線偏多分數達此值且量能為正 → 升級為加碼（否則只算買進）
  weekly_all_synced_label: "加碼（各週期已同步翻多）"

# ==================================================================
# 觀望 watch_rules（含強制降級為觀望的規則）
# ==================================================================
watch_rules:

  caution_only_on_macd_divergence: true   # 只有MACD單獨背離、均線與量能都還沒同步走壞 → 先觀望不追空
  mtm_60m_exit_downgrade: true            # 60分MTM翻空但生死線未破 → 觀望，短線先出場觀察
  cci_exit_alert_downgrade: true          # 60分/5分 CCI由+100之上折返跌破 → 觀望，與MTM並列同等級示警，不凌駕MTM/MACD/均線
  extreme_deviation_downgrade: true       # 乖離過大 → 買進/加碼一律降級觀望
  triangle_consolidation_downgrade: true  # 三角收斂尚未帶量突破（或假突破）→ 買進/加碼一律降級觀望，
                                           # 不凌駕生死線下彎/四關價破底等硬否決產生的「賣出減碼」
                                           # （見下方 pattern_recognition.triangle_consolidation）
  w_bottom_kd365_downgrade: true  # W底型態偵測到、但均線/MACD/KD(36,5,5)尚未同步確認
                                   # （reasons顯示「型態轉折待確認」）→ 買進/加碼一律降級觀望，
                                   # 不凌駕生死線下彎/四關價破底等硬否決產生的「賣出減碼」。
                                   # 2026-10-13新增，依據test_kd365_w_bottom_buy.py回測（21檔/
                                   # 24個月）：KD365剛黃金交叉(3日內)比非剛交叉在5/10/20日
                                   # 三個天期報酬與上漲比例都明顯更好（詳見kd365.
                                   # w_bottom_fresh_cross_window區塊註解），設為false可隨時
                                   # 關掉、不用改程式碼。

  # 新規則①：買進/加碼的三項同時條件，任一項未確認就一律觀望，
  # 不可輸出「買進（部分週期訊號仍待確認）」這類模糊結論。
  buy_add_sync_gate:
    enabled: true
    apply_timeframes: ["週", "日", "60分", "5分"]
    require:
      - ma_slope_up            # 均線上揚
      - macd_volume_sync_up    # MACD/BBI(OBV) 同步轉向
      - support_intact         # 支撐未破（生死線未跌破、四關價未破底）
    downgrade_to: "觀望"
    message: "買進/加碼三項同時條件（均線上揚、MACD/BBI同步轉向、支撐未破）未全數確認，判定為觀望"

  # 新規則②：週線出現短期噴出型態時，即使短週期指標翻多，仍強制降級為觀望，
  # 須等到站回週5MA至週20MA之間才重新評估。
  weekly_blowoff_guard:
    enabled: true
    applicable_timeframes: ["週"]
    leg_lookback_weeks: 8         # 回看幾週計算單一波段漲幅
    leg_gain_threshold: 0.80      # 波段漲幅超過此比例視為遠超歷史正常區間
    deviation_ma_columns: ["MA5", "MA20", "MA35"]  # 需同時脫離的均線
    deviation_threshold: 0.35     # 與上述均線的乖離同時超過此比例才算「明顯脫離」
    downgrade_to: "觀望"
    message_template: "週線短期噴出型態：近{lookback}週單一波段漲幅達{gain:.0%}，且明顯脫離所有均線（{ma_cols}），即使短週期指標翻多仍強制降級為觀望，須等到站回週5MA至週20MA之間才重新評估"

  # 跨週期整合（combine_timeframes）：長天期已翻多但未全數同步時，
  # 禁止輸出模糊結論，一律判定觀望。
  combine_timeframes_ambiguous_guard:
    forbid_ambiguous_partial_bullish: true
    replacement_conclusion: "觀望（各週期訊號尚未同步翻多，依SOP不可輸出模糊結論，暫不追價）"

# ==================================================================
# 賣出減碼 sell_rules
# ==================================================================
sell_rules:
  key_ma_down_veto: true       # 生死線下彎且跌破 → 硬否決，直接賣出減碼
  four_key_broken: true        # 日線四關價：今開跌破昨低 → 賣出減碼
  dead_cross_confirmed: true   # MACD死亡交叉 且 均線同步偏空 → 賣出減碼
  volume_bear_confirm: true    # MACD頂背離 + OBV/BBI同步走壞（真正頂背離） → 賣出減碼
  # 2026-10-07新增：volume_bear_confirm要不要也要求均線同步偏空(ma_bias<0)
  # 才算全賣確認，否則降級為「分級減碼」（conclusion仍是賣出減碼，但caveats
  # 註明建議只先減碼50%）。背景：金像電(2368) 2026-10-02收盤觸發頂背離+OBV
  # 判賣出減碼，均線(MA35)當時仍上揚且站上，隔一個交易日卻在PCB族群消息面
  # 帶動下鎖漲停——用test_volume_bear_confirm_ma_gate(_wide).py回測驗證
  # （60檔/36個月/138筆事件）：均線仍偏多時單獨出現這個訊號，20日後續跌
  # 45.3%、上漲54.7%（接近銅板），但兩端都有肥尾（最差-47%、最佳+75.4%）。
  # 設為true才會要求均線同步；設為false則完全恢復成改動前的行為（頂背離+
  # OBV單獨即可全賣，不管均線方向）。
  volume_bear_confirm_requires_ma_sync: true
  kd365_veto_enabled: true
  # 2026-10-12新增：KD(36,5,5)死叉+MACD死叉(Double Check)+生死線斜率轉
  # 下彎，同時成立時否決conclusion、直接賣出減碼。依據課程錄音《中山
  # 北路二段65巷6號.m4a》的賣出/出場條件說明採用，但test_kd365_double_
  # check.py的回測證據還不夠扎實（21檔/24個月，A/B/C三組差異不明顯、
  # C組長天期樣本數只有19/7筆），使用者在證據不夠強的情況下仍決定採用，
  # 設為false可以隨時關掉、不用改程式碼。
  score_threshold: -3          # 綜合分數 <= 門檻 → 賣出減碼

# ==================================================================
# 型態學輔助標記層（pattern_recognition）
# ------------------------------------------------------------------
# ⚠️ 這是「輔助觸發層」，不是判讀主體，任何情況下都不可單獨產生買賣結論：
#   - W底/M頭偵測到「右底比左底高/右頭比左頭低 → 突破頸線 → 回測不破 →
#     出現確認K棒」的完整序列時，只觸發「注意轉折」提醒，並自動連動檢查
#     當下週期 Step2 均線斜率、Step3 MACD 是否同步同向：兩者都同步才標記
#     「轉折訊號確認」，否則標記為「型態轉折待確認」——不論哪一種，都只是
#     附加在「理由」欄位的輔助說明，不影響「結論」欄位的判定來源（結論
#     仍完全由既有四關價→均線斜率→MACD→OBV/BBI分層否決制決定）。
#   - W底/M頭偵測到的頸線位置，併入 Step6 左側平台支撐/壓力的候選來源
#     之一，與既有K棒整理平台並列使用，尤其在缺乏明顯歷史平台時作為補充。
#   - 三角收斂偵測到「高點不再創高、低點不再破低」的收斂區間時，直接視為
#     SOP「各週期訊號互相矛盾」觀望條件之一，持續監控；只有當價格「帶量」
#     突破區間邊界時才解除強制觀望，改由六步SOP既有的分數/否決邏輯正常
#     決定最終結論（而不是直接以突破方向下買賣結論）。「帶量」一律用
#     Step4 既有的 OBV_MA／BBI 斜率驗證（5分線比照 Step4 改用 BBI），
#     不另外新增獨立的成交量判斷邏輯，避免規則來源分裂。假突破（價格突破
#     但量能未同步）維持強制觀望。
#   - 三角收斂的強制觀望只會把「買進/加碼」降級，不會凌駕生死線下彎、
#     四關價破底等硬否決規則產生的「賣出減碼」（維持既有分層否決制位階）。
# ==================================================================
pattern_recognition:

  w_bottom:
    enabled: true
    pivot_window: 5              # 局部高低點判斷窗口，比照Step6左側平台同款設定
    lookback_bars: 60            # 只在最近這段K棒裡找左右兩個底部，避免抓到很久以前的雜訊
    neckline_tolerance_pct: 0.02 # 回測頸線「不破」的容忍度，比照Step6 tolerance_pct概念

  m_top:
    enabled: true
    pivot_window: 5
    lookback_bars: 60
    neckline_tolerance_pct: 0.02

  triangle_consolidation:
    enabled: true
    pivot_window: 5
    lookback_bars: 40              # 三角收斂通常是較短的整理區間，看較近的窗口
    min_pivots: 2                  # 高點/低點至少各要有幾個轉折點，才算「收斂區間」而非雜訊
    breakout_tolerance_pct: 0.01   # 收盤價超出區間邊界多少才算「突破」，避免雜訊誤判
    range_tolerance_pct: 0.01      # 判斷「高點不再創高／低點不再破低」時的容忍度
    compression_ratio: 0.7         # 近半段的高低區間寬度，須收斂到早半段區間寬度的此比例以下，
                                    # 才算真正的「收斂」——只比較窗口頭尾兩個轉折點會漏抓中間
                                    # 曾經創出更高/更低極值、之後又縮回來的情況（那不是三角收斂，
                                    # 只是區間中段曾經走出去過），必須看「整段前半vs後半」才夠準確
    max_range_pct: 0.20            # 近半段（目前收斂區間）本身的高低區間寬度，相對低點不能超過
                                    # 這個比例，否則即使比早半段窄，實際上仍然太寬、不是真正貼近
                                    # 收斂完成的三角形——預設值非但丁老師教材明確數字，可依實戰
                                    # 經驗調整（見 left_side_platform 同類型的經驗值）

# ==================================================================
# 特殊情境提示（不改變買賣結論，只附加but書）
# ==================================================================
special_notes:
  ma120_second_leg_hint: true   # 大跌測半年線(MA120)打出第二隻腳未破 → 提示「帶著鋼盔慢買」

# ==================================================================
# 漸進式部位建議（suggested_exposure，不影響conclusion本身）
# ------------------------------------------------------------------
# 但丁老師課程新增的5級部位控管概念：100%(買進/加碼) / 70%(觀望但均線
# 支撐未破) / 50%(單一指標示警) / 30%(MACD+KD365雙重轉弱確認但均線未破)
# / 0%(hard_sell，均線已破位)。這個表格待backtest驗證微調，先建好管線
# 讓資料能跑出來。
# ==================================================================
exposure_rules:
  watch_support_held: 70   # 但丁老師原話「7至8成」，取中間值，可調整
  sell_default: 30         # 經score門檻判成賣出減碼、但未觸發hard_sell/
                            # 雙重示警的較弱賣出訊號，預設給的曝險建議

