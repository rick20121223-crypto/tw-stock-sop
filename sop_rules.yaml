# updated 2026-10-31：根據1030錄音「程式單權重配比」筆記，新增可選的
#   scoring.mode="weighted_48_20_20"（均線48%／四關價20%／指標組
#   (MACD+KD+CCI)20%），對照但丁老師原始程式單的加權計分邏輯。預設
#   scoring.mode仍是"legacy"（現有公式完全不變），只有手動切換才會套用
#   新公式——還沒backtest驗證過，用test_scoring_weighted_48_20_20.py只
#   驗證了公式本身的計算正確性，跨股票的實際分類差異待之後用類似
#   test_combine_weighting_compare.py的方式比對。OBV/左側平台
#   (volume_bias/platform_bias)不在但丁老師這次講的三層結構裡，兩種
#   mode都維持原本的額外加分方式不變，不套用這組百分比。詳見本檔
#   indicators.scoring區塊註解，以及sop_decision.py的_normalize_bias/
#   _weighted_score_48_20_20/_step5b_cci。
# updated 2026-10-30：根據1030實戰課程筆記補強第二代指標，兩項更新：
#   ①CCI參數依課程指示從14改為12（配合下方indicators.cci.period），已套用
#   於stock_core.calc_cci()——但原有confirm_bars=3是在period=14下用
#   test_short_term_whipsaw_fix_compare.py驗證過的，period改12後尚未重新
#   backtest，confirm_bars=3是否仍適用待確認；②KD(36,5,5)課程重新定位為
#   「第二代（跟MACD並列雙重驗證）」，原本indicators.kd365註解寫「第三代」，
#   純文字修正，不影響任何計分/否決邏輯。
#   另外筆記提到的「CCI最快示警→MTM同步確認→KD365雙重確認→均線裁決」
#   明確優先順序，以及「MACD零軸下+KD365+CCI三者同步死叉」的新否決條件，
#   都還沒backtest驗證——目前cci/mtm刻意維持role: secondary「並列參考、
