# 紙上交易系統規則設定（跨帳戶共用，市場結構/系統政策層級的數字）。

account_defaults:
  # 帳戶個別風險偏好參數（ledger_store.Account的預設值）的單一來源。
  # 新建帳戶時可以個別調整，這裡只決定「沒特別調整時」的初始值；
  # ledger_store.Account的dataclass欄位預設值、pages/5_交易日誌.py的
  # 表單預設值都從這裡讀，不要各自寫死。
  max_position_pct: 0.10      # 單檔部位上限，占目前帳戶淨值的比例
  max_holdings_count: 8       # 持股檔數上限
  max_loss_pct: 0.01          # 單筆最大虧損，占目前帳戶淨值的比例

stock_pool:
  type: fixed_list           # fixed_list | index_constituents | liquidity_topn
  version_tag: "v1-固定清單-核心持股"  # 每筆Order/Fill都會記錄這個字串（見ledger_store.Order/performance.Fill的universe_version欄位）
  fixed_list:
    source: "stock_core.STOCK_NAME_MAP"
  index_constituents:        # type=index_constituents時才讀這塊
    index_code: "0050"
    refresh_frequency: "quarterly"
  liquidity_topn:            # type=liquidity_topn時才讀這塊
    top_n: 100

liquidity:
  min_avg_trade_value_20d: 30000000   # 20日均成交值門檻（新台幣），低於此排除

eligibility:
  exclude_disposition: false        # 處置股改為可以買進(複查後決定)，但eligibility.is_eligible()
                                     # 回傳的EligibilityResult.warnings會標記"是處置股"，不算進ineligible的reasons。
                                     # 設回true可以復原成完全排除(例如想更保守時)。
  exclude_full_delivery: true       # 排除全額交割股
  exclude_new_listing: true         # 排除上市未滿一定交易日數的新股
  new_listing_min_trading_days: 60  # 上市未滿此交易日數視為新股（用日曆天數近似，非精確交易日曆）

fill_defer:
  buy_max_defer_days: 3       # 漲停鎖死，買單最多順延幾個交易日（不含訊號當天），超過就取消
  sell_max_defer_days: null   # 跌停鎖死，賣單不設上限，順延到賣出為止

priority:
  sort_key: "avg_trade_value_20d"  # 同日訊號數多於空位/現金時的排序依據
  descending: true                  # true=數值大者優先

live_trading_gate:
  min_trade_count: 30         # 放行實單門檻：已平倉交易筆數下限
  max_drawdown_pct: 0.15      # 放行實單門檻：最大回撤上限（占帳戶淨值比例）
  require_beat_benchmark: true  # 放行實單門檻：扣成本後報酬是否需優於0050
